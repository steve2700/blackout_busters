<svg width="560" height="150" viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blackout Busters — Electrical &amp; Solar Solutions">
  <defs>
    <clipPath id="badgeClip">
      <rect x="10" y="20" width="112" height="112" rx="27"/>
    </clipPath>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123763"/>
      <stop offset="1" stop-color="#0B2545"/>
    </linearGradient>
  </defs>

  <!-- ===== ICON BADGE ===== -->
  <rect x="10" y="20" width="112" height="112" rx="27" fill="url(#badgeGrad)"/>

  <g clip-path="url(#badgeClip)">
    <!-- faint solar grid, upper-left -->
    <g stroke="#FFB800" stroke-width="2.5" opacity="0.18">
      <line x1="20" y1="42" x2="78" y2="42"/>
      <line x1="20" y1="58" x2="78" y2="58"/>
      <line x1="34" y1="30" x2="34" y2="70"/>
      <line x1="52" y1="30" x2="52" y2="70"/>
      <line x1="70" y1="30" x2="70" y2="70"/>
    </g>
    <!-- sun rays, top-right -->
    <g stroke="#FFB800" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="104" y1="36" x2="104" y2="28"/>
      <line x1="114" y1="46" x2="121" y2="42"/>
      <line x1="94" y1="46" x2="88" y2="42"/>
    </g>
    <circle cx="104" cy="47" r="7" fill="#FFB800" opacity="0.85"/>
  </g>

  <!-- amber lightning bolt -->
  <path d="M80,34 L44,84 L64,84 L52,120 L96,66 L74,66 Z"
        fill="#FFB800" stroke="#0B2545" stroke-width="3" stroke-linejoin="round"/>

  <!-- red power accent dot -->
  <circle cx="98" cy="112" r="9" fill="#D62828"/>
  <rect x="96.5" y="100" width="3" height="9" rx="1.5" fill="#FFFFFF"/>

  <!-- crisp inner ring -->
  <rect x="10" y="20" width="112" height="112" rx="27" fill="none" stroke="#FFB800" stroke-width="3" opacity="0.35"/>

  <!-- ===== WORDMARK ===== -->
  <text x="140" y="66" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="46" letter-spacing="0.5" fill="#0B2545">BLACKOUT</text>
  <text x="140" y="112" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="46" letter-spacing="0.5" fill="#FFB800">BUSTERS</text>

  <!-- tagline -->
  <text x="142" y="136" font-family="Arial, sans-serif" font-weight="700" font-size="15"
        letter-spacing="4.5" fill="#5b6b82">ELECTRICAL &amp; SOLAR SOLUTIONS</text>
</svg>
